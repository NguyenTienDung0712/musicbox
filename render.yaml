services:
  - type: web
    name: musicbox-pos
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    numInstances: 1
    maxShutdownDelaySeconds: 30
    disk:
      name: musicbox-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
